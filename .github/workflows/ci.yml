name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN: "0.2.130"

jobs:
  rust:
    name: Rust core (fmt, clippy, tests, fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude arbcalc-python
      - name: Independent check of the fixtures (exact fractions in Python)
        run: |
          spec="$(find ~/.cargo/git/checkouts -path '*venue-specs*/data/venue-specs.json' | head -1)"
          python3 tools/reference.py "$spec"

  wasm:
    name: WASM parity and page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: WASM fixture parity (Node)
        run: |
          cargo build -p arbcalc-wasm --target wasm32-unknown-unknown --profile wasm
          wasm-bindgen target/wasm32-unknown-unknown/wasm/arbcalc_wasm.wasm --target nodejs --out-dir crates/wasm/pkg-node
          node crates/wasm/tests/parity.mjs
      - name: Build the page (typecheck, bundle, size and offline checks)
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build
      - name: Page checks in Chrome (verdicts, largest check, no requests after load, CSP)
        working-directory: web
        run: CHROME="$(command -v google-chrome || command -v chromium)" npm run bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page
          path: |
            web/dist
            /tmp/arbcalc.png
            /tmp/arbcalc-mobile.png

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel and run the tests (sockets are blocked in tests)
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -m crates/python/Cargo.toml --out wheels
          python -m pip install wheels/*.whl "pytest>=7"
          python -m pytest crates/python/tests -q
